name: Validate blocklist

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # The hourly sync pushes data without human review, so an independent
    # daily check catches a generator that started emitting valid-but-wrong
    # data on a commit nobody looked at.
    - cron: "17 6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile, lint, test, and validate publication files
        # Go is the additive publication gate. Python remains only as an exact
        # current-corpus parity oracle during the shadow period. `make check`
        # also rejects alternate extensions, interpreted-language shebangs,
        # secret-like material, and known Go vulnerabilities.
        # Output is captured for the failure-alert step below.
        run: make check 2>&1 | tee validator-output.txt

      - name: Close CI failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "CI validation passed — closing automatically."
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number')
          BODY="## CI Validation Failed

          **Commit:** ${{ github.sha }}
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Time:** $(date -u)

          ### Validator Output
          \`\`\`
          $(cat validator-output.txt 2>/dev/null || echo 'No output captured')
          \`\`\`
          "
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "CI validation failure — blocklist gate tripped" --label ci-failure --body "$BODY"
          fi
