name: Validate blocklist

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # The hourly sync pushes data without human review, so an independent
    # daily check catches a generator that started emitting valid-but-wrong
    # data on a commit nobody looked at.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile, lint, test, and validate publication files
        # Go is the additive publication gate. Python remains only as an exact
        # current-corpus parity oracle during the shadow period. `make check`
        # also rejects alternate extensions, interpreted-language shebangs,
        # secret-like material, and known Go vulnerabilities.
        run: make check
